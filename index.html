<html lang="ko">
<head>

<title>화면</title>
<style>
:root{--bg:#e7e8ec;--ink:#1b1c20;--mute:#6b6e78;--panel:#f6f6f8;--line:#c9cbd3;--acc:#2f6fed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--ink:#ececf0;--mute:#9a9da8;--panel:#202228;--line:#33363f;--acc:#6b9bff}}
:root[data-theme="dark"]{--bg:#15161a;--ink:#ececf0;--mute:#9a9da8;--panel:#202228;--line:#33363f;--acc:#6b9bff}
html,body{overscroll-behavior:none}
body{touch-action:manipulation;-webkit-text-size-adjust:100%}
#sig{position:absolute;z-index:6;left:285px;top:20px;width:19px;height:auto;display:block;pointer-events:none}
.nosig #sig{display:none}
.sigblack #sig{filter:brightness(0)}
#toast{display:none;position:fixed;left:16px;right:16px;bottom:24px;z-index:99;background:#222;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;text-align:center}
html.shoot{background:#000;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;padding:0}
html.shoot body{position:fixed;inset:0;overflow:hidden;background:transparent}
.screen{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
nav{display:flex;gap:8px;align-items:center}
button,.file{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc)}
.ctrl{display:flex;gap:12px;flex-wrap:wrap;padding:12px 20px;align-items:end;border-bottom:1px solid var(--line)}
.grp{display:flex;gap:8px;flex-wrap:wrap}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:130px}
.file input{display:none}
.slide{display:none;padding:20px 20px 36px}
.slide.on{display:block}
.stage{display:flex;justify-content:center}
.fit{position:relative}
.scale{position:absolute;left:0;top:0;transform-origin:0 0}
.shoot .stage{position:fixed;inset:0;z-index:50;background:transparent;align-items:center}
.shoot .screen{border-radius:0;background:transparent}
.shoot .wall,.shoot .screen::before{display:none}
.shoot .stage{touch-action:none}
.exit{display:none}
.shoot .exit{display:block;position:fixed;left:0;top:0;width:56px;height:56px;z-index:60;opacity:0;padding:0;border:0}
.shoot header,.shoot .ctrl,.shoot .note{display:none}
.note{max-width:640px;margin:18px auto 0;font-size:13px;color:var(--mute);line-height:1.6;text-align:center}
.ph{text-align:center;color:var(--mute);padding:120px 0}
/* 390x844pt screen. 위치·크기는 실제 캡처(393x852pt)를 3px=1pt로 환산, 아래쪽 기준 */
.screen{width:390px;height:844px;border-radius:47px;overflow:hidden;position:relative;color:#fff;background:#0c0f18}
.wall{display:block;position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(24px)}
[data-dev="13"] .wall{background-color:#1a1742;background-image:radial-gradient(55% 38% at 28% 28%,#ff6fb0 0%,transparent 70%),radial-gradient(60% 42% at 74% 62%,#3d6bff 0%,transparent 70%),radial-gradient(50% 30% at 30% 85%,#8a4bff 0%,transparent 70%)}
[data-dev="13pro"] .wall{background-color:#16293b;background-image:linear-gradient(112deg,transparent 28%,rgba(150,200,240,.6) 44%,transparent 58%),linear-gradient(102deg,transparent 46%,rgba(200,230,250,.4) 56%,transparent 70%),linear-gradient(#2a4b66,#0e1a28)}
.screen::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.34);z-index:1}
.status{position:absolute;top:14px;left:0;right:0;height:20px;z-index:4;font-size:15px;font-weight:600}
.status .t{position:absolute;left:36px;top:0}
.status .r{position:absolute;right:26px;top:2px;display:flex;gap:5px;align-items:center}
.bars{display:flex;gap:1.5px;align-items:flex-end;height:11px}.bars i{width:3px;background:#fff;border-radius:1px}
.net{font-size:12px;font-weight:700}
.batt{width:24px;height:11px;border:1px solid rgba(255,255,255,.45);border-radius:3.5px;padding:1px;position:relative}
.batt::after{content:"";position:absolute;right:-3px;top:3px;width:1.5px;height:4px;background:rgba(255,255,255,.45);border-radius:0 1px 1px 0}
.batt b{display:block;height:100%;width:80%;background:#fff;border-radius:2px}
.batt.low b{background:#ff3b30}
.nobar .status{display:none}
.who{position:absolute;top:112px;left:0;right:0;text-align:center;z-index:3;padding:0 24px}
.who .n{font-size:34px;font-weight:600;line-height:40px;letter-spacing:-.2px}
.who .s{font-size:16px;opacity:.9;margin-top:6px}
.who .s:empty{display:none}
.unk .who{display:flex;flex-direction:column-reverse;align-items:center}
.unk .who .s{font-size:19px;line-height:22px;opacity:.6;margin:0 0 6px}
[data-state="call"] .who{top:138px}
.timer{display:none;position:absolute;top:110px;left:0;right:0;text-align:center;z-index:3;font-size:22px;font-weight:600;line-height:26px;color:rgba(255,255,255,.55);font-variant-numeric:tabular-nums}
.c{display:flex;flex-direction:column;align-items:center;font-size:14px;white-space:nowrap}
.dot{border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.38)}
.dot svg{fill:#fff}
/* 수신: 메시지 보내기 / 음성 사서함 (원 지름 44, 중심 y=600, 가로 20%/80%) */
.mini{position:absolute;left:0;right:0;top:578px;height:80px;z-index:3}
.mini .c{position:absolute;top:0;width:130px;gap:7px}
.mini .c:nth-child(1){left:calc(20% - 65px)}.mini .c:nth-child(2){left:calc(80% - 65px)}
.mini .dot{width:44px;height:44px}.mini .dot svg{width:22px;height:22px}.mini .c:nth-child(2) svg{width:30px;height:30px}
/* 버튼형(캡처 없음, 추정) */
.big{position:absolute;left:0;right:0;top:690px;height:110px;z-index:3}
.big .c{position:absolute;top:0;width:100px;gap:10px}
.big .c:nth-child(1){left:calc(20% - 50px)}.big .c:nth-child(2){left:calc(80% - 50px);cursor:pointer}
.big .dot{width:78px;height:78px;border:0}.big svg{width:34px;height:34px}
.red{background:#ff3b30}.grn{background:#34c759}
.dec svg{transform:rotate(135deg)}
/* 밀어서 통화하기: 폭 322, 높이 90, 중심 y=729, 안쪽 흰 원 78 */
.slider{position:absolute;left:34px;right:34px;top:684px;height:90px;border-radius:45px;background:rgba(255,255,255,.2);border:1.5px solid rgba(160,200,230,.55);display:none;align-items:center;z-index:3}
.slider .k{touch-action:none;cursor:grab;position:relative;z-index:2;width:78px;height:78px;margin-left:4.5px;border-radius:50%;background:#f4fefd;display:grid;place-items:center}
.slider .k svg{width:36px;height:36px;fill:#62c56d}
.slider span{flex:1;text-align:center;font-size:21px;padding-right:12px;background:linear-gradient(90deg,rgba(255,255,255,.4) 0%,rgba(255,255,255,.8) 50%,rgba(255,255,255,.4) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:sh 2.2s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.slider span{animation:none}}
[data-mode="slide"] .slider{display:flex}
[data-mode="slide"] .big{display:none}
/* 통화 중: 원 지름 78, 가로 20/50/80%, 세로 중심 604 / 729 */
.grid{display:none;position:absolute;left:39px;width:312px;top:calc(565px - var(--up,0px));grid-template-columns:repeat(3,78px);column-gap:39px;row-gap:20px;z-index:3}
.gb{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:14px;height:105px;white-space:nowrap}
.gb .dot{width:78px;height:78px}.gb svg{width:36px;height:36px}
.gb .redd{background:#c72d22;border-color:rgba(255,150,140,.65)}
.gb svg.rot{transform:rotate(135deg);width:34px;height:34px}
#endc{cursor:pointer}
.home{display:none;position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:140px;height:5px;border-radius:3px;background:rgba(255,255,255,.75);z-index:4}
[data-state="call"] .who .s,[data-state="call"] .mini,[data-state="call"] .big,[data-state="call"] .slider{display:none}
[data-state="call"] .timer{display:block}
[data-state="call"] .grid{display:grid}
[data-state="call"] .home{display:block}
</style>
</head>

<script>
const W=390,H=844;let K=1;
const $=id=>document.getElementById(id),scr=$('scr'),root=document.body;
let fade=140;
try{const f=localStorage.getItem('fade');if(f!==null&&!isNaN(parseFloat(f)))fade=parseFloat(f)}catch(_){}
function paintCanvas(){const h=document.documentElement;
  if(!root.classList.contains('shoot')){h.style.backgroundColor=h.style.backgroundImage=h.style.backgroundSize=h.style.backgroundRepeat=h.style.backgroundPosition='';document.body.style.backgroundImage='';return}
  const w=$('wall'),c=getComputedStyle(w),v=vp();
  const m=(c.backgroundColor.match(/\d+/g)||[0,0,0]).slice(0,3).map(n=>Math.round(n*0.66)),D='rgb('+m.join(',')+')';
  h.style.backgroundColor=D;
  document.body.style.backgroundImage=fade>0?'linear-gradient(to bottom, rgba('+m.join(',')+',0) calc(100% - '+fade+'px), '+D+' 100%)':'';
